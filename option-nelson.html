  <script>
    (function () {
      try {
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const getStored = () => localStorage.getItem("theme");
        const resolve = () => {
          const pref = getStored();
          if (pref === "light" || pref === "dark") return pref;
          return media.matches ? "dark" : "light";
        };
        const apply = () => {
          const mode = resolve();
          document.documentElement.classList.toggle("dark", mode === "dark");
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", mode === "dark" ? "#161513" : "#fdfcfb");
        };
        if (!getStored()) localStorage.setItem("theme", "system");
        apply();
        media.addEventListener("change", apply);
        window.__setTheme = (pref) => {
          localStorage.setItem("theme", pref);
          apply();
        };
        window.__getTheme = () => getStored() || "system";
        window.__getResolvedTheme = () => resolve();
        window.__cycleTheme = () => {
          const order = ["system", "light", "dark"];
          const current = window.__getTheme();
          const next = order[(order.indexOf(current) + 1) % order.length];
          window.__setTheme(next);
          return next;
        };
      } catch (_) {
        /* no-op */
      }
    })();
  </script>

  <script>
    (function () {
      const btn = document.getElementById("theme-toggle");
      if (!btn) return;
      const label = () => {
        const pref = window.__getTheme ? window.__getTheme() : "system";
        btn.setAttribute("aria-label", "Toggle theme (currently " + pref + ")");
        btn.setAttribute("title", "Theme: " + pref);
      };
      label();
      btn.addEventListener("click", function () {
        if (window.__cycleTheme) window.__cycleTheme();
        label();
      });
    })();
